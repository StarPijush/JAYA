[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI Assistant for Windows - Voice Recognition Phase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.6",
    "faster-whisper>=1.2",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "scipy>=1.17",
]
optional-dependencies = {dev = ["pytest>=8.3", "httpx>=0.28"]}
license = {text = "MIT"}
authors = [{name = "Jaya", email = "you@example.com"}]
keywords = ["ai", "assistant", "windows", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
"jarvis-api" = "services.api.__main__:main"
    "jarvis-voice" = "core.voice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"